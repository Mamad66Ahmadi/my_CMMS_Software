{# sidebar.html #}
<nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="brand">
            <i class="bi bi-gear-wide-connected brand-icon"></i>
            <span class="brand-text">CMMS</span>
        </div>
        <span id="sidebarToggle" class="sidebar-toggle-icon" title="Collapse / Expand">&#8249;</span>
    </div>

    <div class="sidebar-section-label">OPERATIONS</div>

    <div class="accordion accordion-flush" id="sidebarAccordion">

        <!-- Dashboard -->
        <div class="sidebar-item">
            <button class="sidebar-nav-btn collapsed" data-bs-toggle="collapse" data-bs-target="#dashboardCollapse">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
                {% if pending_requests_count > 0 and request.user.is_staff %}
                    <span class="badge-pill">{{ pending_requests_count }}</span>
                {% endif %}
                <i class="bi bi-chevron-right chevron"></i>
            </button>
            <div id="dashboardCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                <a href="{% url 'accounts:dashboard' %}" class="sidebar-sub-link">
                    <i class="bi bi-circle-fill dot"></i> Overview
                </a>
            </div>
        </div>

        <!-- Work Orders -->
        <div class="sidebar-item">
            <button class="sidebar-nav-btn collapsed" data-bs-toggle="collapse" data-bs-target="#workordersCollapse">
                <i class="bi bi-wrench-adjustable"></i>
                <span>Work Orders</span>
                <i class="bi bi-chevron-right chevron"></i>
            </button>
            <div id="workordersCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                <a href="{% url 'work_orders:fault_report_add' %}" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> New Fault Report</a>
                <a href="{% url 'work_orders:wo_search' %}" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> Work Orders</a>
                <a href="{% url 'work_orders:fault_report_list' %}" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> Fault Reports</a>
            </div>
        </div>

        <!-- Daily Reports -->
        <div class="sidebar-item">
            <button class="sidebar-nav-btn collapsed" data-bs-toggle="collapse" data-bs-target="#reportsCollapse">
                <i class="bi bi-journal-text"></i>
                <span>Daily Reports</span>
                <i class="bi bi-chevron-right chevron"></i>
            </button>
            <div id="reportsCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                <a href="{% url 'daily_reports:report_list' %}" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> View Logs</a>
                <a href="{% url 'daily_reports:create_report' %}" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> Add Daily Report</a>
            </div>
        </div>

        <!-- Permits -->
        <div class="sidebar-item">
            <button class="sidebar-nav-btn collapsed" data-bs-toggle="collapse" data-bs-target="#permitsCollapse">
                <i class="bi bi-shield-check"></i>
                <span>Permits</span>
                <i class="bi bi-chevron-right chevron"></i>
            </button>
            <div id="permitsCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                <a href="{% url 'permits:permit_list'%}" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> View Permits</a>
                <a href="{% url 'permits:work_shift_list' %}" class="sidebar-sub-link"><i class="bi bi-calendar2-week dot"></i> Work Shifts</a>
                <a href="#" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> Add Permit</a>
                <a href="{% url 'permits:pis_holders' %}" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> PIS Qualified Users</a>
            </div>
        </div>

        <!-- ASSETS SECTION -->
        <div class="sidebar-section-label mt-2">ASSET MANAGEMENT</div>

        <!-- Location Tag -->
        <div class="sidebar-item">
            <button class="sidebar-nav-btn collapsed" data-bs-toggle="collapse" data-bs-target="#locationTagCollapse">
                <i class="bi bi-geo-alt"></i>
                <span>Location Tag</span>
                <i class="bi bi-chevron-right chevron"></i>
            </button>
            <div id="locationTagCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                <a href="{% url 'equipment:location_tag_list' %}" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> Search</a>
                <a href="{% url 'equipment:location_tag_create_request' %}" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> Add New</a>
            </div>
        </div>

        <!-- Equipment -->
        <div class="sidebar-item">
            <button class="sidebar-nav-btn collapsed" data-bs-toggle="collapse" data-bs-target="#equipmentCollapse">
                <i class="bi bi-cpu"></i>
                <span>Equipment</span>
                <i class="bi bi-chevron-right chevron"></i>
            </button>
            <div id="equipmentCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                <a href="{% url 'equipment:equipment_list' %}" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> Search</a>
                <a href="{% url 'equipment:equipment_request_create' %}" class="sidebar-sub-link"><i class="bi bi-circle-fill dot"></i> Add New</a>
            </div>
        </div>

        <!-- Documents -->
        <div class="sidebar-item">
            <button class="sidebar-nav-btn collapsed" onclick="window.location.href='#'">
                <i class="bi bi-folder2-open"></i>
                <span>Documents</span>
            </button>
        </div>

    </div>
</nav>
