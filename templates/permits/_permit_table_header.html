{% comment %}
Expected:
column
label
sort_by
query_params
{% endcomment %}

{% with asc=column desc="-"|add:column %}
    {% if sort_by == asc %}
        <th class="sorted"
            onclick="window.location.href='?sort={{ desc }}{% if query_params %}&{{ query_params }}{% endif %}'">
            {{ label }}
            <span class="sort-arrow asc"></span>
        </th>

    {% elif sort_by == desc %}
        <th class="sorted"
            onclick="window.location.href='?sort={{ asc }}{% if query_params %}&{{ query_params }}{% endif %}'">
            {{ label }}
            <span class="sort-arrow desc"></span>
        </th>

    {% else %}
        <th
            onclick="window.location.href='?sort={{ asc }}{% if query_params %}&{{ query_params }}{% endif %}'">
            {{ label }}
            <span class="sort-arrow"></span>
        </th>
    {% endif %}
{% endwith %}
