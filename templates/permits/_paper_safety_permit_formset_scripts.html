<script>
function initPaperSafetyPermitFormset() {
    const rowsContainer = document.getElementById("paper-safety-permit-rows");
    const emptyFormTemplate = document.getElementById("paper-safety-permit-empty-form");
    const addButton = document.getElementById("add-paper-safety-permit");
    const totalForms = document.getElementById("id_paper_safety_permits-TOTAL_FORMS");
    const emptyState = document.getElementById("paper-safety-permit-empty-state");
    const linkedContainer = document.getElementById("continuation-linked-safety-permits");

    const pickerToggle = document.getElementById("toggle-existing-safety-picker");
    const pickerFields = document.getElementById("existing-safety-picker-fields");
    const pickerType = document.getElementById("existing-safety-type");
    const pickerNumber = document.getElementById("existing-safety-number");
    const pickerResults = document.getElementById("existing-safety-results");

    if (!rowsContainer || !emptyFormTemplate || !totalForms) return;

    if (linkedContainer) {
        linkedContainer.querySelectorAll("[data-remove-server-linked-safety]").forEach(function (button) {
            button.addEventListener("click", function () {
                const card = button.closest("[data-server-linked-safety-permit]");
                const id = button.dataset.removeServerLinkedSafety;
                const hidden = linkedContainer.querySelector(
                    'input[name="continuation_safety_permit_ids"][value="' + id + '"]'
                );
                if (hidden) hidden.remove();
                if (card) card.remove();
            });
        });
    }

    if (pickerToggle && pickerFields && pickerType && pickerNumber && pickerResults) {
        let pickerActiveIndex = -1;

        pickerToggle.addEventListener("click", function () {
            pickerFields.hidden = !pickerFields.hidden;
            if (!pickerFields.hidden) pickerType.focus();
        });

        function clearPickerResults() {
            pickerResults.innerHTML = "";
            pickerResults.classList.remove("is-visible");
            pickerActiveIndex = -1;
        }

        function setPickerActive(index) {
            const options = Array.from(pickerResults.querySelectorAll(".autocomplete-option"));
            if (!options.length) return;
            pickerActiveIndex = Math.max(0, Math.min(index, options.length - 1));
            options.forEach(function (option, optionIndex) {
                option.classList.toggle("active", optionIndex === pickerActiveIndex);
            });
            options[pickerActiveIndex].scrollIntoView({ block: "nearest" });
        }

        function renderPickerResults(items) {
            pickerResults.innerHTML = "";
            pickerActiveIndex = -1;
            (items || []).forEach(function (item) {
                const option = document.createElement("button");
                option.type = "button";
                option.className = "list-group-item list-group-item-action autocomplete-option";
                option.innerHTML = "<strong>" + item.safety_permit_number + "</strong> <span class='text-muted'>— " + item.safety_type_text + (item.location_tag_text ? " — " + item.location_tag_text : "") + "</span>";
                option.addEventListener("mouseenter", function () {
                    setPickerActive(Array.from(pickerResults.querySelectorAll(".autocomplete-option")).indexOf(option));
                });
                option.addEventListener("click", function () {
                    const alreadyLinked = linkedContainer && linkedContainer.querySelector('input[name="continuation_safety_permit_ids"][value="' + item.id + '"]');
                    if (!alreadyLinked && linkedContainer) {
                        const hidden = document.createElement("input");
                        hidden.type = "hidden";
                        hidden.name = "continuation_safety_permit_ids";
                        hidden.value = item.id;
                        linkedContainer.appendChild(hidden);

                        const card = document.createElement("div");
                        card.className = "alert alert-secondary d-flex justify-content-between align-items-center gap-3 mt-2 mb-0";
                        card.dataset.serverLinkedSafetyPermit = item.id;
                        card.innerHTML = "<span><strong>" + item.safety_type_text + "</strong> <span class='text-muted'>" + item.safety_permit_number + "</span>" + (item.location_tag_text ? " — " + item.location_tag_text : "") + "</span><span class='d-flex align-items-center gap-2'><span class='badge text-bg-secondary'>" + (item.status || "Shared") + " · Shared</span><button type='button' class='btn btn-sm btn-outline-danger' data-remove-server-linked-safety='" + item.id + "'>Remove</button></span>";
                        const remove = card.querySelector("[data-remove-server-linked-safety]");
                        remove.addEventListener("click", function () { hidden.remove(); card.remove(); });
                        linkedContainer.appendChild(card);
                    }
                    pickerNumber.value = "";
                    clearPickerResults();
                });
                pickerResults.appendChild(option);
            });
            pickerResults.classList.toggle("is-visible", pickerResults.children.length > 0);
            if (pickerResults.children.length) setPickerActive(0);
        }

        let pickerTimer;
        pickerType.addEventListener("change", function () {
            pickerNumber.disabled = !pickerType.value;
            pickerNumber.value = "";
            clearPickerResults();
            if (pickerNumber.disabled) pickerType.focus();
        });
        pickerNumber.addEventListener("input", function () {
            clearTimeout(pickerTimer);
            const query = pickerNumber.value.trim();
            if (!pickerType.value || query.length < 2) return;
            pickerTimer = setTimeout(function () {
                const url = new URL("{% url 'permits:paper_safety_permit_autocomplete' %}", window.location.origin);
                url.searchParams.set("q", query);
                url.searchParams.set("safety_type", pickerType.value);
                {% if permit.permit_number %}url.searchParams.set("permit_number", "{{ permit.permit_number|escapejs }}");{% endif %}
                fetch(url.toString(), { headers: { "X-Requested-With": "XMLHttpRequest" } })
                    .then(function (response) { return response.json(); })
                    .then(function (data) { renderPickerResults(data.results || []); })
                    .catch(clearPickerResults);
            }, 250);
        });
        pickerNumber.addEventListener("keydown", function (event) {
            const options = pickerResults.querySelectorAll(".autocomplete-option");
            if (!options.length) return;
            if (event.key === "ArrowDown") {
                event.preventDefault();
                setPickerActive(pickerActiveIndex + 1);
            } else if (event.key === "ArrowUp") {
                event.preventDefault();
                setPickerActive(pickerActiveIndex - 1);
            } else if (event.key === "Enter" && pickerActiveIndex >= 0) {
                event.preventDefault();
                options[pickerActiveIndex].click();
            } else if (event.key === "Escape") {
                clearPickerResults();
            }
        });
    }

    function styleFields(scope) {
        scope.querySelectorAll('select[name$="-safety_type"]').forEach(function (field) {
            field.classList.add("form-select");
        });
        scope.querySelectorAll('input[name$="-safety_permit_number"]').forEach(function (field) {
            field.classList.add("form-control");
            field.setAttribute("placeholder", "Optional until issued");
        });
        scope.querySelectorAll('.safety-location-search').forEach(function (input) {
            if (input.dataset.bound) return;
            input.dataset.bound = "1";
            const hidden = input.parentElement.querySelector('input[type="hidden"][name$="-location_tag"]');
            const results = input.parentElement.querySelector('.safety-location-results');
            let activeIndex = -1;
            const setActive = function (index) {
                const options = Array.from(results.querySelectorAll('.autocomplete-option'));
                if (!options.length) return;
                activeIndex = Math.max(0, Math.min(index, options.length - 1));
                options.forEach((option, i) => option.classList.toggle('active', i === activeIndex));
                options[activeIndex].scrollIntoView({ block: 'nearest' });
            };
            input.addEventListener('input', function () {
                const q = input.value.trim();
                if (!q) { hidden.value = ""; results.innerHTML = ""; results.classList.remove("is-visible"); return; }
                fetch(input.dataset.autocompleteUrl + "?q=" + encodeURIComponent(q))
                    .then(r => r.json()).then(data => {
                        results.innerHTML = "";
                        (data.results || []).forEach(item => {
                            const option = document.createElement('button');
                            option.type = 'button'; option.className = 'list-group-item list-group-item-action autocomplete-option';
                            option.textContent = item.text;
                            option.addEventListener('mouseenter', function () { setActive(Array.from(results.querySelectorAll('.autocomplete-option')).indexOf(option)); });
                            option.addEventListener('click', function () { input.value = item.text; hidden.value = item.id; results.innerHTML = ""; results.classList.remove("is-visible"); });
                            results.appendChild(option);
                        });
                        activeIndex = -1;
                        if (results.children.length) setActive(0);
                        results.classList.toggle("is-visible", results.children.length > 0);
                    });
            });
            input.addEventListener('keydown', function (event) {
                const options = results.querySelectorAll('.autocomplete-option');
                if (!options.length) return;
                if (event.key === 'ArrowDown') { event.preventDefault(); setActive(activeIndex + 1); }
                else if (event.key === 'ArrowUp') { event.preventDefault(); setActive(activeIndex - 1); }
                else if (event.key === 'Enter' && activeIndex >= 0) { event.preventDefault(); options[activeIndex].click(); }
                else if (event.key === 'Escape') { results.innerHTML = ""; results.classList.remove("is-visible"); }
            });
        });
    }

    function updateEmptyState() {
        const visibleRows = rowsContainer.querySelectorAll(
            "[data-paper-safety-permit-row]:not([hidden])"
        );
        if (emptyState) {
            emptyState.hidden = visibleRows.length > 0;
        }
    }

    function bindRemoveButton(button) {
        button.addEventListener("click", function () {
            const row = button.closest("[data-paper-safety-permit-row]");
            if (!row) return;

            const typeField = row.querySelector('select[name$="-safety_type"]');
            const numberField = row.querySelector('input[name$="-safety_permit_number"]');
            const typeLabel = typeField && typeField.selectedIndex >= 0
                ? typeField.options[typeField.selectedIndex].text.trim()
                : "";
            const numberLabel = numberField ? numberField.value.trim() : "";

            let description = "this safety permit";
            if (typeLabel && numberLabel) {
                description = typeLabel + " (" + numberLabel + ")";
            } else if (typeLabel) {
                description = typeLabel;
            } else if (numberLabel) {
                description = "permit number " + numberLabel;
            }

            const confirmed = window.confirm(
                "Remove " + description + "?\n\nThis safety permit will be deleted when you save the form."
            );
            if (!confirmed) return;

            const deleteField = row.querySelector('input[name$="-DELETE"]');
            if (deleteField) {
                deleteField.checked = true;
            }
            row.hidden = true;
            updateEmptyState();
            updateCardNumbers();
        });
    }

    rowsContainer
        .querySelectorAll("[data-remove-paper-safety-permit]")
        .forEach(bindRemoveButton);
    styleFields(rowsContainer);
    updateEmptyState();
    
    function updateCardNumbers() {
        rowsContainer.querySelectorAll("[data-paper-safety-permit-row]:not([hidden])").forEach((row, index) => {
            const numberEl = row.querySelector(".safety-permit-card__number");
            if (numberEl && !numberEl.textContent.includes("__prefix__")) numberEl.textContent = index + 1;
        });
    }

    function addRowFromSuggestion(suggestion) {
        const formIndex = Number.parseInt(totalForms.value, 10);
        const html = emptyFormTemplate.innerHTML.replaceAll(
            "__prefix__",
            String(formIndex)
        );
        const wrapper = document.createElement("div");
        wrapper.innerHTML = html.trim();
        const row = wrapper.firstElementChild;
        if (!row) return null;

        rowsContainer.appendChild(row);
        totalForms.value = String(formIndex + 1);
        styleFields(row);

        const typeField = row.querySelector('select[name$="-safety_type"]');
        if (typeField && suggestion.safety_type) {
            typeField.value = String(suggestion.safety_type);
        }

        const locationField = row.querySelector('input[type="hidden"][name$="-location_tag"]');
        const locationInput = row.querySelector(".safety-location-search");
        if (locationField) locationField.value = suggestion.location_tag || "";
        if (locationInput) locationInput.value = suggestion.location_tag_text || "";

        const removeButton = row.querySelector("[data-remove-paper-safety-permit]");
        if (removeButton) bindRemoveButton(removeButton);
        updateEmptyState();
        updateCardNumbers();
        return row;
    }

    window.addContinuationSafetySuggestions = function (suggestions) {
        const panel = document.getElementById("continuation-safety-suggestions");
        const list = document.getElementById("continuation-safety-suggestion-list");
        const acceptAll = document.getElementById("accept-all-continuation-safety");
        const linkedContainer = document.getElementById("continuation-linked-safety-permits");
        if (!panel || !list || !linkedContainer) return;

        list.innerHTML = "";
        linkedContainer.innerHTML = "";
        const pending = (suggestions || []).map(function (item) {
            return Object.assign({ accepted: false }, item);
        });

        function linkExistingPermit(item) {
            const hidden = document.createElement("input");
            hidden.type = "hidden";
            hidden.name = "continuation_safety_permit_ids";
            hidden.value = item.id;
            linkedContainer.appendChild(hidden);

            const card = document.createElement("div");
            card.className = "alert alert-secondary d-flex justify-content-between align-items-center gap-3 mt-2 mb-0";
            const location = item.location_tag_text ? " — " + item.location_tag_text : "";
            const details = document.createElement("span");
            details.innerHTML = "<strong>" + item.safety_type_text + "</strong>" +
                " <span class='text-muted'>" + (item.safety_permit_number || "Number pending") + "</span>" + location;
            const actions = document.createElement("span");
            actions.className = "d-flex align-items-center gap-2";
            const status = document.createElement("span");
            status.className = "badge text-bg-secondary";
            status.textContent = (item.status || "") + " · Shared";
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "btn btn-sm btn-outline-danger";
            remove.textContent = "Remove";
            remove.addEventListener("click", function () {
                hidden.remove();
                card.remove();
                item.accepted = false;
                render();
            });
            actions.appendChild(status);
            actions.appendChild(remove);
            card.appendChild(details);
            card.appendChild(actions);
            linkedContainer.appendChild(card);
        }

        function render() {
            list.innerHTML = "";
            pending.filter(item => !item.accepted).forEach(function (item) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "list-group-item list-group-item-action d-flex justify-content-between align-items-center";
                const location = item.location_tag_text ? " — " + item.location_tag_text : "";
                button.innerHTML = "<span><strong>" + item.safety_type_text + "</strong>" + location +
                    (item.safety_permit_number ? " <span class='text-muted'>(previous no. " + item.safety_permit_number + ")</span>" : "") +
                    "</span><span class='btn btn-sm btn-primary'>Accept</span>";
                button.addEventListener("click", function () {
                    linkExistingPermit(item);
                    item.accepted = true;
                    render();
                });
                list.appendChild(button);
            });
            panel.hidden = pending.every(item => item.accepted) || pending.length === 0;
            if (acceptAll) acceptAll.hidden = panel.hidden;
        }

        if (acceptAll) {
            acceptAll.onclick = function () {
                pending.filter(item => !item.accepted).forEach(function (item) {
                    linkExistingPermit(item);
                    item.accepted = true;
                });
                render();
            };
        }
        render();
    };

    if (addButton) {
        addButton.addEventListener("click", function () {
            addRowFromSuggestion({});
        });
    }
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initPaperSafetyPermitFormset);
} else {
    initPaperSafetyPermitFormset();
}
</script>
