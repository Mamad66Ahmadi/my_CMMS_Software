<section class="detail-panel">
    <div class="detail-panel__header">
        <i class="bi bi-shield-exclamation"></i>
        Fire, Gas &amp; ESD Isolations
    </div>

    <div class="detail-panel__body">
        <div class="form-field-block">
            <div class="fg-esd-select-list">
                {% for checkbox in form.fire_gas_esd_items %}
                    <div
                        class="fg-esd-select-item"
                        data-fg-esd-id="{{ checkbox.data.value }}"
                    >
                        <label
                            class="fg-esd-select-item__main"
                            for="{{ checkbox.id_for_label }}"
                        >
                            {{ checkbox.tag }}

                            <span class="fg-esd-select-item__label persian-text">
                                <bdi>{{ checkbox.choice_label }}</bdi>
                            </span>
                        </label>

                        <input
                            type="text"
                            name="fg_esd_unit_zone_{{ checkbox.data.value }}"
                            class="fg-esd-select-item__input persian-text"
                            placeholder="Unit / Zone"
                            disabled
                        >

                        <input
                            type="text"
                            name="fg_esd_remarks_{{ checkbox.data.value }}"
                            class="fg-esd-select-item__input persian-text"
                            placeholder="Remark (optional)"
                            disabled
                        >
                    </div>
                {% empty %}
                    <div class="text-muted">
                        No active Fire, Gas &amp; ESD items are configured.
                    </div>
                {% endfor %}
            </div>

            {% if form.fire_gas_esd_items.errors %}
                <div class="field-errors">
                    {{ form.fire_gas_esd_items.errors }}
                </div>
            {% endif %}
        </div>
    </div>
</section>


<script>
// ============================================================
// 1. Enable / disable Unit-Zone and Remarks based on checkbox
// ============================================================
window.syncFgEsdItemState = function (row) {
    const checkbox = row.querySelector('input[type="checkbox"]');

    if (!checkbox) {
        return;
    }

    const unitZoneInput = row.querySelector(
        'input[name^="fg_esd_unit_zone_"]'
    );

    const remarksInput = row.querySelector(
        'input[name^="fg_esd_remarks_"]'
    );

    const isChecked = checkbox.checked;

    // Visual state
    row.classList.toggle("checked", isChecked);

    // Enable / disable the text fields
    if (unitZoneInput) {
        unitZoneInput.disabled = !isChecked;
    }

    if (remarksInput) {
        remarksInput.disabled = !isChecked;
    }
};


// ============================================================
// 2. Populate Fire / Gas / ESD items from continuation data
// ============================================================
window.populateContinuationFgEsdItems = function (fgEsdItems) {

    console.group("Continuation FG/ESD population");
    console.log("received fire_gas_esd_items:", fgEsdItems);

    if (!Array.isArray(fgEsdItems)) {
        console.error(
            "fire_gas_esd_items is missing or not an array:",
            fgEsdItems
        );
        console.groupEnd();
        return;
    }

    fgEsdItems.forEach(function (item) {

        const itemId = item.fire_gas_esd_id;

        const unitZone =
            item.fire_gas_esd_unit_zone ??
            item.unit_zone ??
            "";

        const remarks =
            item.fire_gas_esd_remarks ??
            item.remarks ??
            "";

        console.log("Processing FG/ESD item:", item);

        const row = document.querySelector(
            '.fg-esd-select-item[data-fg-esd-id="' + itemId + '"]'
        );

        if (!row) {
            console.warn(
                "No matching FG/ESD row found for id:",
                itemId
            );
            return;
        }

        const checkbox = row.querySelector(
            'input[type="checkbox"]'
        );

        const unitZoneInput = row.querySelector(
            'input[name^="fg_esd_unit_zone_"]'
        );

        const remarksInput = row.querySelector(
            'input[name^="fg_esd_remarks_"]'
        );


        // --------------------------------------------------------
        // Check the item
        // --------------------------------------------------------

        if (checkbox) {
            checkbox.checked = true;
        }


        // --------------------------------------------------------
        // Enable inputs BEFORE assigning their values
        // --------------------------------------------------------

        if (unitZoneInput) {
            unitZoneInput.disabled = false;
            unitZoneInput.value = unitZone;
        }

        if (remarksInput) {
            remarksInput.disabled = false;
            remarksInput.value = remarks;
        }


        // --------------------------------------------------------
        // Sync visual/input state
        // --------------------------------------------------------

        window.syncFgEsdItemState(row);
    });

    console.groupEnd();
};


// ============================================================
// 3. Initialize checkbox handlers
// ============================================================
document.addEventListener("DOMContentLoaded", function () {

    console.log("FG/ESD script loaded & DOM ready");

    document
        .querySelectorAll(".fg-esd-select-item")
        .forEach(function (row) {

            const checkbox = row.querySelector(
                'input[type="checkbox"]'
            );

            if (!checkbox) {
                return;
            }


            // ----------------------------------------------------
            // Checkbox changed
            // ----------------------------------------------------

            checkbox.addEventListener("change", function () {

                window.syncFgEsdItemState(row);

            });


            // ----------------------------------------------------
            // Initial state
            // ----------------------------------------------------

            window.syncFgEsdItemState(row);
        });
});
</script>
