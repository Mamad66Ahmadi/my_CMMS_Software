{% load static %}

<form method="get" action="">
    {% if sort_by %}<input type="hidden" name="sort" value="{{ sort_by }}">{% endif %}
    {% if per_page %}<input type="hidden" name="per_page" value="{{ per_page }}">{% endif %}

    <div class="filter-panel mb-3">

        <div class="filter-panel__header">
            <div class="filter-search-group">
                <i class="bi bi-search filter-search-icon"></i>
                <input type="text"
                       name="q"
                       class="filter-search-input"
                       placeholder="Search Permit No. or Work Order No. (comma-separated)"
                       value="{{ filters.q|default:'' }}">
            </div>
            <div class="filter-actions">
                <button type="submit" class="btn-filter-primary">
                    <i class="bi bi-search"></i> Search
                </button>
                <button type="button"
                        class="btn-filter-secondary {% if has_advanced_filters %}active{% endif %}"
                        data-bs-toggle="collapse"
                        data-bs-target="#advancedSearchCollapse"
                        aria-expanded="{% if has_advanced_filters %}true{% else %}false{% endif %}">
                    <i class="bi bi-sliders2"></i> Filters
                    {% if has_advanced_filters %}<span class="filter-badge">●</span>{% endif %}
                </button>
                {% if query_params or filters.q %}
                    <a href="{% url 'permits:permit_list' %}" class="btn-filter-clear">
                        <i class="bi bi-x-circle"></i> Clear
                    </a>
                {% endif %}
            </div>
        </div>

        <div class="collapse {% if has_advanced_filters %}show{% endif %}" id="advancedSearchCollapse">
            <div class="filter-panel__body">
                <div class="filter-grid">

                    <div class="filter-field">
                        <label class="filter-label">Permit Number</label>
                        <input type="text"
                               name="permit_number"
                               class="filter-input"
                               placeholder="P-100, P-101"
                               value="{{ filters.permit_number }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Continuation Of</label>
                        <input type="text"
                               name="continuation_of"
                               class="filter-input"
                               placeholder="Parent permit no."
                               value="{{ filters.continuation_of }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Status</label>
                        <select name="status" class="filter-select">
                            <option value="ALL" {% if filters.status == "ALL" %}selected{% endif %}>All Statuses</option>
                            {% for code, label in status_choices %}
                                <option value="{{ code }}" {% if filters.status == code %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Location Tag</label>
                        <input type="text"
                               name="location_tag"
                               class="filter-input"
                               placeholder="103-KM-101, 103-KM-102"
                               value="{{ filters.location_tag }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Parent Tag</label>
                        <input type="text"
                               name="parent_tag"
                               class="filter-input"
                               placeholder="Parent tag"
                               value="{{ filters.parent_tag }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Unit</label>
                        <input type="text"
                               name="unit"
                               class="filter-input"
                               placeholder="Unit code"
                               value="{{ filters.unit }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Train</label>
                        <input type="text"
                               name="train"
                               class="filter-input"
                               placeholder="Train"
                               value="{{ filters.train }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Work Order No.</label>
                        <input type="text"
                               name="work_order"
                               class="filter-input"
                               placeholder="WO-123, WO-124"
                               value="{{ filters.work_order }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Department</label>
                        <select name="department" class="filter-select">
                            <option value="">All Departments</option>
                            {% for dept in departments %}
                                <option value="{{ dept.name }}" {% if filters.department == dept.name %}selected{% endif %}>{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Hazard Code</label>
                        <select name="hazard_code" class="filter-select">
                            <option value="">All Hazards</option>
                            {% for hz in hazard_codes %}
                                <option value="{{ hz.code }}" {% if filters.hazard_code == hz.code %}selected{% endif %}>
                                    {{ hz.code }} - {{ hz.description|slice:":30" }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Authorized Issuer</label>
                        <input type="text"
                               name="authorized_issuer"
                               class="filter-input"
                               placeholder="Username"
                               value="{{ filters.authorized_issuer }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Permit Holder</label>
                        <input type="text"
                               name="permit_holder"
                               class="filter-input"
                               placeholder="Username"
                               value="{{ filters.permit_holder }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Created By</label>
                        <input type="text"
                               name="created_by"
                               class="filter-input"
                               placeholder="Username"
                               value="{{ filters.created_by }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Modified By</label>
                        <input type="text"
                               name="modified_by"
                               class="filter-input"
                               placeholder="Username"
                               value="{{ filters.modified_by }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Description</label>
                        <input type="text"
                               name="description"
                               class="filter-input"
                               placeholder="Description text"
                               value="{{ filters.description }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Comment</label>
                        <input type="text"
                               name="comment"
                               class="filter-input"
                               placeholder="Comment text"
                               value="{{ filters.comment }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Valid From</label>
                        <input type="date"
                               name="valid_from_date"
                               class="filter-input"
                               value="{{ filters.valid_from_date }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Valid To</label>
                        <input type="date"
                               name="valid_to_date"
                               class="filter-input"
                               value="{{ filters.valid_to_date }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Created From</label>
                        <input type="date"
                               name="created_from"
                               class="filter-input"
                               value="{{ filters.created_from }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Created To</label>
                        <input type="date"
                               name="created_to"
                               class="filter-input"
                               value="{{ filters.created_to }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Modified From</label>
                        <input type="date"
                               name="modified_from"
                               class="filter-input"
                               value="{{ filters.modified_from }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Modified To</label>
                        <input type="date"
                               name="modified_to"
                               class="filter-input"
                               value="{{ filters.modified_to }}">
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Excavation</label>
                        <select name="is_excavation" class="filter-select">
                            <option value="">All</option>
                            <option value="true" {% if filters.is_excavation == "true" %}selected{% endif %}>True</option>
                            <option value="false" {% if filters.is_excavation == "false" %}selected{% endif %}>False</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Spading</label>
                        <select name="is_spading" class="filter-select">
                            <option value="">All</option>
                            <option value="true" {% if filters.is_spading == "true" %}selected{% endif %}>True</option>
                            <option value="false" {% if filters.is_spading == "false" %}selected{% endif %}>False</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Confined Space</label>
                        <select name="is_confined_space" class="filter-select">
                            <option value="">All</option>
                            <option value="true" {% if filters.is_confined_space == "true" %}selected{% endif %}>True</option>
                            <option value="false" {% if filters.is_confined_space == "false" %}selected{% endif %}>False</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Equipment Test</label>
                        <select name="is_equipment_test" class="filter-select">
                            <option value="">All</option>
                            <option value="true" {% if filters.is_equipment_test == "true" %}selected{% endif %}>True</option>
                            <option value="false" {% if filters.is_equipment_test == "false" %}selected{% endif %}>False</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Radiography</label>
                        <select name="is_radiography" class="filter-select">
                            <option value="">All</option>
                            <option value="true" {% if filters.is_radiography == "true" %}selected{% endif %}>True</option>
                            <option value="false" {% if filters.is_radiography == "false" %}selected{% endif %}>False</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Diving</label>
                        <select name="is_diving" class="filter-select">
                            <option value="">All</option>
                            <option value="true" {% if filters.is_diving == "true" %}selected{% endif %}>True</option>
                            <option value="false" {% if filters.is_diving == "false" %}selected{% endif %}>False</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label class="filter-label">Currently Valid</label>
                        <select name="is_currently_valid" class="filter-select">
                            <option value="">All</option>
                            <option value="true" {% if filters.is_currently_valid == "true" %}selected{% endif %}>True</option>
                            <option value="false" {% if filters.is_currently_valid == "false" %}selected{% endif %}>False</option>
                        </select>
                    </div>

                </div>

                <div class="filter-panel__footer">
                    <button type="submit" class="btn-filter-primary">
                        <i class="bi bi-funnel-fill"></i> Apply Filters
                    </button>
                </div>
            </div>
        </div>

    </div>
</form>
