<div class="filter-panel mb-3">

    {% include "permits/_permit_filter_header.html" %}


    <div class="offcanvas offcanvas-end filter-offcanvas"
         tabindex="-1"
         id="filterOffcanvas"
         aria-labelledby="filterOffcanvasLabel">

        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title" id="filterOffcanvasLabel">
                <i class="bi bi-funnel-fill"></i> Advanced Filters
            </h5>
            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas"
                    aria-label="Close"></button>
        </div>

        <div class="offcanvas-body d-flex flex-column p-0">
            <div class="filter-panel__body flex-grow-1" style="overflow-y:auto;">

                <form method="get" action="" id="advancedFilterForm">
                    {% if sort_by %}
                        <input type="hidden" name="sort" value="{{ sort_by }}">
                    {% endif %}

                    {% if per_page %}
                        <input type="hidden" name="per_page" value="{{ per_page }}">
                    {% endif %}

                    <div class="filter-sections">
                        {% include "permits/_permit_filter_sections.html" %}
                    </div>
                </form>

                {% include "permits/_permit_filter_favorites.html" %}
            <div class="filter-panel__footer border-top"
                 style="position:sticky; bottom:0; background:var(--c-bg-surface); margin-top:0;">
                <button type="submit" form="advancedFilterForm" class="btn-filter-primary w-100">
                    <i class="bi bi-funnel-fill"></i> Apply Filters
                </button>
            </div>
        </div>
    </div>

</div>

{% include "permits/_permit_filter_scripts.html" %}
