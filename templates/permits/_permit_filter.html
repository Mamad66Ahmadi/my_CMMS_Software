{% load static %}

<div class="page-subtitle text-uppercase fw-bold mb-2" style="letter-spacing: 0.05em;">Filter Pane</div>

<form method="get" action="">
    <div class="filter-bar">
        <!-- Row 1 -->
        <div class="filter-group">
            <label class="filter-label">Permit Number</label>
            <input type="text" name="permit_number" class="filter-input" placeholder="P-100..." value="{{ filters.permit_number }}">
        </div>
        <div class="filter-group">
            <label class="filter-label">Valid From</label>
            <input type="date" name="valid_from_date" class="filter-input" value="{{ filters.valid_from_date }}">
        </div>
        <div class="filter-group">
            <label class="filter-label">Valid To</label>
            <input type="date" name="valid_to_date" class="filter-input" value="{{ filters.valid_to_date }}">
        </div>
        <div class="filter-group">
            <label class="filter-label">Status</label>
            <select name="status" class="filter-input">
                <option value="">All Statuses</option>
                {% for code, label in status_choices %}
                    <option value="{{ code }}" {% if filters.status == code %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="filter-group">
            <label class="filter-label">Department</label>
            <select name="department" class="filter-input">
                <option value="">All</option>
                {% for dept in departments %}
                    <option value="{{ dept.name }}" {% if filters.department == dept.name %}selected{% endif %}>{{ dept.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Row 2 -->
        <div class="filter-group">
            <label class="filter-label">Hazard Code</label>
            <select name="hazard_code" class="filter-input">
                <option value="">All</option>
                {% for hz in hazard_codes %}
                    <option value="{{ hz.code }}" {% if filters.hazard_code == hz.code %}selected{% endif %}>
                        {{ hz.code }} - {{ hz.description|slice:":30" }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="filter-group">
            <label class="filter-label">Location Tag</label>
            <input type="text" name="location_tag" class="filter-input" placeholder="103-KM-101..." value="{{ filters.location_tag }}">
        </div>
        <div class="filter-group">
            <label class="filter-label">Work Order No.</label>
            <input type="text" name="work_order" class="filter-input" placeholder="WO-123..." value="{{ filters.work_order }}">
        </div>

        <!-- Actions -->
        <div class="filter-actions">
            <button type="submit" class="btn-primary-custom">Apply</button>
            {% if query_params %}
                <a href="{% url 'permits:permit_list' %}" class="btn-secondary-custom" style="padding: 7px 15px; font-size: 13px; display: inline-flex; align-items: center;">Clear</a>
            {% endif %}
        </div>
    </div>
</form>
