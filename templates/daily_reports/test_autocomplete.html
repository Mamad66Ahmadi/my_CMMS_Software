<!DOCTYPE html>
<html>
<head>
    <title>Autocomplete Test</title>
</head>
<body>
    <h1>Autocomplete Test</h1>
    
    <!-- The Input -->
    <input type="text" id="location-search" 
           data-autocomplete-url="/equipment/locationtag-autocomplete/" 
           placeholder="Search location...">

    <div id="location-results" style="border: 1px solid #ccc; width: 200px;"></div>
    <input type="hidden" id="id_location_tag">

    <script>
        const input = document.getElementById("location-search");
        const resultsBox = document.getElementById("location-results");
        const hidden = document.getElementById("id_location_tag");

        input.addEventListener("keyup", function () {
            const query = input.value;
            const url = input.getAttribute("data-autocomplete-url");
            
            console.log("Fetching from:", url + "?q=" + encodeURIComponent(query));

            if (query.length < 2) return;

            fetch(url + "?q=" + encodeURIComponent(query))
                .then(r => r.json())
                .then(data => {
                    resultsBox.innerHTML = "";
                    data.results.forEach(item => {
                        const div = document.createElement("div");
                        div.textContent = item.text;
                        div.style.cursor = "pointer";
                        div.onclick = () => { input.value = item.text; };
                        resultsBox.appendChild(div);
                    });
                })
                .catch(err => console.error("Fetch Error:", err));
        });
    </script>
</body>
</html>
