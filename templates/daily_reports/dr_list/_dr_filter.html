<h5>Filter Pane</h5>

<form method="get" action="">
<div class="filter-bar">

<div class="filter-group">
<label class="filter-label">Date From</label>
<input type="date" name="date_from" class="filter-input"
value="{{ filters.date_from }}">
</div>

<div class="filter-group">
<label class="filter-label">Date To</label>
<input type="date" name="date_to" class="filter-input"
value="{{ filters.date_to }}">
</div>

<div class="filter-group">
<label class="filter-label">WO Number</label>
<input type="text" name="wo_number" class="filter-input"
placeholder="Search..."
value="{{ filters.wo_number }}">
</div>

<div class="filter-group">
<label class="filter-label">Location Tag</label>
<input type="text" name="location_tag" class="filter-input"
placeholder="Tag..."
value="{{ filters.location_tag }}">
</div>

<div class="filter-group">
<label class="filter-label">Status</label>
<select name="status" class="filter-input">
<option value="">All</option>
<option value="completed" {% if filters.status == "completed" %}selected{% endif %}>Completed</option>
<option value="ongoing" {% if filters.status == "ongoing" %}selected{% endif %}>Ongoing</option>
<option value="waiting" {% if filters.status == "waiting" %}selected{% endif %}>Waiting</option>
</select>
</div>

<div class="filter-group">
<label class="filter-label">Department</label>
<input type="text" name="department" class="filter-input"
placeholder="Department"
value="{{ filters.department }}">
</div>

<div class="filter-group">
<label class="filter-label">Rows Per Page</label>
<select name="per_page" class="filter-input">
<option value="10" {% if per_page == 10 %}selected{% endif %}>10</option>
<option value="25" {% if per_page == 25 %}selected{% endif %}>25</option>
<option value="50" {% if per_page == 50 %}selected{% endif %}>50</option>
<option value="100" {% if per_page == 100 %}selected{% endif %}>100</option>
</select>
</div>

<div class="filter-actions">
<button type="submit" class="btn-search">Apply</button>

{% if filters.date_from or filters.date_to or filters.wo_number or filters.location_tag or filters.status or filters.department %}
<a href="{% url 'daily_reports:report_list' %}" class="btn-clear">
Clear All
</a>
{% endif %}
</div>

</div>
</form>
