<div class="modal fade" id="reportModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content report-modal">

      <div class="modal-header">
        <h5 class="modal-title">Daily Report Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="row g-3">

          <div class="col-md-6">

            <div class="detail-item">
              <span class="label">Date</span>
              <span id="m-date"></span>
            </div>

            <div class="detail-item">
              <span class="label">Day</span>
              <span id="m-day"></span>
            </div>

            <div class="detail-item">
              <span class="label">Location Tag</span>
              <span id="m-tag"></span>
            </div>

            <div class="detail-item">
              <span class="label">Parent Tag</span>
              <span id="m-parent"></span>
            </div>

            <div class="detail-item">
              <span class="label">WO Number</span>
              <span id="m-wo"></span>
            </div>

          </div>

          <div class="col-md-6">

            <div class="detail-item">
              <span class="label">Status</span>
              <span id="m-status" class="badge bg-secondary"></span>
            </div>

            <div class="detail-item">
              <span class="label">Actual Start</span>
              <span id="m-start"></span>
            </div>

            <div class="detail-item">
              <span class="label">Department</span>
              <span id="m-dept"></span>
            </div>

            <div class="detail-item">
              <span class="label">Employees</span>
              <span id="m-employees" class="rtl-text"></span>
            </div>

          </div>

        </div>

        <hr>

        <div class="description-box">
          <div class="label">Description</div>
          <div id="m-desc" class="rtl-text"></div>
        </div>

      </div>

    </div>
  </div>
</div>
