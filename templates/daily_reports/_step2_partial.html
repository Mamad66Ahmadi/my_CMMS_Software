<div class="row">
    <div class="col-md-6">
        <label class="form-label">Date</label>
        {{ form.date }}
    </div>
    <div class="col-md-6">
        <label class="form-label">Department</label>
        {{ form.department }}
    </div>
</div>

<div class="mt-3">
    <label class="form-label">Work Order Number</label>
    {{ form.wo_number }}
</div>

<div class="mt-3">
    <label class="form-label">Employees</label>
    {{ form.employees }}
</div>

<div class="mt-4 text-end">
    <button type="button" class="btn btn-outline-secondary" onclick="document.getElementById('step-1').style.display='block'; document.getElementById('step-2').style.display='none';">Back</button>
    <button type="submit" class="btn btn-primary">Save Report</button>
</div>
