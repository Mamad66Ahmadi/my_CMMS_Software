{% comment %}
Expected:
column
label
sort_by
query_params
{% endcomment %}

{% with asc=column desc="-"|add:column %}

{% if sort_by == asc %}
    <th class="sorted"
        onclick="window.location.href='?sort={{ desc }}&{{ query_params }}'">
        {{ label }}
        <span class="sort-arrow">▲</span>
    </th>

{% elif sort_by == desc %}
    <th class="sorted"
        onclick="window.location.href='?sort={{ asc }}&{{ query_params }}'">
        {{ label }}
        <span class="sort-arrow">▼</span>
    </th>

{% else %}
    <th
        onclick="window.location.href='?sort={{ asc }}&{{ query_params }}'">
        {{ label }}
        <span class="sort-arrow"></span>
    </th>
{% endif %}

{% endwith %}
