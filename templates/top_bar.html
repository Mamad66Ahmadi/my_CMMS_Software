<div class="vazir-topbar d-flex justify-content-between align-items-center px-3">

    <!-- LEFT SIDE: Dates -->
    <div class="topbar-dates">
        <i class="bi bi-calendar3" style="color:#9aa8b6;"></i>
        <span id="weekday" class="weekday">{{ weekday_name }}</span>
        <span class="divider">|</span>
        <span id="gregorian-date">{{ gregorian_date }}</span>
        <span class="divider">|</span>
        <span id="jalali-date">{{ jalali_date_persian }}</span>
    </div>

    <!-- RIGHT SIDE: User info -->
    <div class="profile-container" id="profileContainer">

        <div class="profile-summary" onclick="toggleProfileMenu(event)">
            <div class="profile-avatar">{{ first_name|slice:":1" }}{{ last_name|slice:":1" }}</div>
            <div class="profile-info">
                <span class="p-name">{{ first_name }} {{ last_name }}</span>
                <span class="p-dept"><i class="bi bi-building"></i> {{ department_name }}</span>
            </div>
            <i class="bi bi-chevron-down profile-caret"></i>
        </div>

        <div id="profile-menu" class="profile-menu">
            <div class="profile-menu-header">
                <div class="full-name">{{ first_name }} {{ last_name }}</div>
                <div class="username"><i class="bi bi-person-badge"></i> {{ username }}</div>
            </div>

            <a href="{% url 'accounts:profile' %}" class="profile-menu-item">
                <i class="bi bi-person-circle"></i> My Profile
            </a>
            <a href="#" class="profile-menu-item">
                <i class="bi bi-gear"></i> Settings
            </a>

            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit" class="profile-menu-item logout">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </form>
        </div>

    </div>
</div>
