<th>
    {% if sort_by == column %}
        <a href="?{% if query_params %}{{ query_params }}&{% endif %}sort=-{{ column }}"
           class="text-decoration-none text-dark fw-bold">
            {{ label }} ▲
        </a>
    {% elif sort_by == "-"|add:column %}
        <a href="?{% if query_params %}{{ query_params }}&{% endif %}sort={{ column }}"
           class="text-decoration-none text-dark fw-bold">
            {{ label }} ▼
        </a>
    {% else %}
        <a href="?{% if query_params %}{{ query_params }}&{% endif %}sort={{ column }}"
           class="text-decoration-none text-dark fw-bold">
            {{ label }}
        </a>
    {% endif %}
</th>
